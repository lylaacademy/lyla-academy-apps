<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>ASNA Educator — American Style Nails Academy</title>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#0b0b0e"/>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png"/>
<link rel="icon" href="icons/favicon.ico" sizes="any"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="ASNA Educator"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0b0b0e; --surface:#151517; --ink:#f6f6f8; --muted:#9a9aa6;
    --accent:#F63FB4; --accent-soft:#ff74cf; --tint:#241420; --hair:#2b2b32; --line:#2b2b32; --red:#ff6b6b; --amber:#ffcf5a; --radius:18px;
    --pink2:#ff74cf; --glow:rgba(246,63,180,.45); --panel2:#1d1d21; --green:#39d69c;
    --serif:"Fraunces",Georgia,serif; --sans:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  /* brand area (login) */
  .brandarea{position:relative;text-align:center;padding-top:8px;margin-bottom:6px}
  .brandarea::before{content:"";position:absolute;left:50%;top:0;width:300px;height:180px;transform:translateX(-50%);background:radial-gradient(closest-side, rgba(255,150,175,.38), rgba(255,150,175,0) 72%);filter:blur(8px);z-index:0;pointer-events:none}
  .wm{position:relative;z-index:1;display:inline-flex;flex-direction:column;align-items:center;gap:8px}
  .wm-stars{color:#C6166E;font-size:13px;letter-spacing:8px;text-indent:8px}
  .wm-title{font-family:"Oswald",var(--sans);font-weight:600;font-size:26px;letter-spacing:1.5px;color:#C6166E;line-height:1}
  .wm-acad{display:flex;align-items:center;gap:11px;font-family:"Oswald",var(--sans);font-weight:500;font-size:12px;letter-spacing:6px;text-indent:6px;color:var(--ink)}
  .wm-acad i{width:26px;height:1.5px;background:var(--ink);display:block}
  .brandsep{color:#D3AE6B;letter-spacing:5px;font-size:12px;margin:16px 0 4px;text-align:center}
  #splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#17141C,#0D0B11);transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .sm{color:#FF2C99;font-size:44px;line-height:1;letter-spacing:6px;text-indent:6px;text-shadow:0 0 14px rgba(255,44,153,.65),0 0 5px rgba(255,44,153,.9)}
  #splash .sm span:nth-child(2){display:inline-block;transform:translateY(-8px)}
  #splash .sl{width:70px;height:3px;border-radius:2px;background:#FF2C99;margin:12px 0 0;box-shadow:0 0 14px rgba(255,44,153,.6)}
  #splash .snm{margin-top:30px;color:rgba(255,255,255,.9);font-family:"Oswald",var(--sans);font-weight:500;font-size:13px;letter-spacing:5px;text-indent:5px;text-align:center}
  #splash .sly{position:absolute;bottom:calc(38px + env(safe-area-inset-bottom));color:rgba(255,255,255,.55);font-size:12px;display:flex;align-items:center;gap:7px}
  #splash .sly i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100dvh}
  .shell{display:flex;min-height:100dvh;max-width:1320px;margin:0 auto;width:100%}
  /* sidebar (desktop only) */
  .side{width:252px;flex:none;background:var(--surface);border-right:1px solid var(--hair);
        display:none;flex-direction:column;padding:26px 18px 18px}
  .brand b{font-family:var(--serif);font-weight:600;font-size:18px;display:block;line-height:1.15}
  .brand span{font-size:10px;font-weight:600;letter-spacing:1.6px;color:var(--muted)}
  .navitem{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font-weight:500;font-size:14px;margin-top:3px}
  .navitem.on{background:var(--tint);color:var(--accent);font-weight:600}
  .navitem svg{width:20px;height:20px;flex:none}
  .navitem .bd{margin-left:auto;background:var(--accent);color:#fff;border-radius:8px;font-size:11px;font-weight:600;padding:1px 7px}
  .sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--hair)}
  .sideacc{display:flex;align-items:center;gap:10px}
  .sideacc .av{width:34px;height:34px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:600;font-size:12px;flex:none}
  .sideacc b{font-size:13px} .sideacc span{font-size:11.5px;color:var(--muted);display:block;cursor:pointer}
  .plyla{font-size:10.5px;color:var(--muted);letter-spacing:.3px;margin:14px 4px 0} .plyla b{color:var(--accent);font-weight:600}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .scroll{flex:1;overflow-y:auto;padding:40px 22px 104px}
  .scroll.noNav{padding-bottom:40px}
  /* typography */
  h1{font-family:var(--serif);font-weight:300;font-size:30px;line-height:1.08;margin:0}
  h2{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.14;margin:0}
  h3{font-family:var(--serif);font-weight:600;font-size:16px;margin:0}
  .over{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0}
  .mut{color:var(--muted)} .role{color:var(--muted);font-size:14px;font-weight:500;margin:4px 0 0}
  .metaline{color:var(--muted);font-size:13.5px;font-weight:500;margin:6px 0 0}
  .metaline b{color:var(--ink);font-family:var(--serif);font-weight:600}
  .hair{height:1px;background:var(--hair);margin:14px 0}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent);font-size:12.5px;flex:none}
  /* student today rows */
  .srow{display:flex;gap:14px;align-items:center;padding:15px 0;border-top:1px solid var(--hair)}
  .srow:first-child{border-top:none}
  .srow .nm{flex:1;min-width:0}
  .srow .nm b{font-weight:600;font-size:15px}
  .srow .nm .tech{color:var(--accent);font-weight:600;font-size:12.5px;margin-top:2px;display:block}
  .srow .nm .sub{color:var(--muted);font-size:12px;margin-top:1px;display:block}
  .srow .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .prog{font-size:12px;font-weight:600;color:var(--ink)} .prog .d{color:var(--muted);font-weight:500}
  .pill{font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap}
  .pill.rev{background:var(--tint);color:var(--accent);cursor:pointer}
  .pill.wait{background:#2a2016;color:var(--amber)}
  .pill.off{background:#23232a;color:var(--muted)}
  .score{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--accent)}
  .stat{display:flex;gap:26px;align-items:baseline;flex-wrap:wrap;margin-top:4px}
  .stat b{font-family:var(--serif);font-weight:600;font-size:22px} .stat .t{color:var(--muted);font-size:12.5px;margin-left:5px}
  .cta{display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer;background:var(--accent);color:#fff;font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.3px;padding:14px 20px;border-radius:12px}
  .cta.full{width:100%} .cta[disabled]{opacity:.5;cursor:default} .cta.sm{padding:10px 16px;font-size:13.5px}
  .ghost{background:transparent;border:1px solid var(--hair);color:var(--ink)}
  .link{color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;background:none;border:none;padding:0;font-family:var(--sans)}
  input,textarea,select{width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:13px 14px;color:var(--ink);font-size:16px;outline:none;font-family:inherit}
  input:focus,textarea:focus,select:focus{border-color:var(--accent)}
  .field{margin-top:13px} .field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.4px;display:block;margin-bottom:5px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .photo{width:100%;background:#171717;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8a8a8a;font-size:11px;letter-spacing:1.2px;min-height:280px}
  .photo img{width:100%;display:block;max-height:70vh;object-fit:contain}
  .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
  .chips button{border:1px solid var(--hair);background:var(--surface);border-radius:9px;padding:11px 0;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .chips button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .back{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:13px;cursor:pointer;background:none;border:none;font-family:var(--sans);padding:0;margin-bottom:16px}
  .maxw{max-width:760px}
  .panel{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:20px}
  .srow.needsassign{background:var(--tint);border-top-color:transparent;border-radius:12px;padding-left:12px;padding-right:12px;margin:6px -12px}
  .absentpanel{background:transparent;border:none;padding:0}
  .absrow{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
  .absrow:first-child{border-top:none}
  .absrow b{font-weight:600;font-size:14.5px;color:var(--muted)}
  .absrow span{font-size:12.5px;color:#A6AEAC}
  .erow .ord{display:flex;flex-direction:column;gap:3px;flex:none}
  .ordb{background:none;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:10px;line-height:1;padding:4px 7px;cursor:pointer;font-family:inherit}
  .ordb:active{background:var(--tint)}
  .ordb:disabled{opacity:.3;cursor:default}
  /* quick student drawer */
  #scrim{position:fixed;inset:0;background:rgba(20,32,30,.26);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  #scrim.on{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:0;height:100dvh;width:468px;max-width:94vw;background:var(--paper);box-shadow:-14px 0 44px rgba(20,32,30,.15);transform:translateX(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #drawer.on{transform:none}
  @media (max-width:899px){ #drawer{width:100vw;max-width:100vw;box-shadow:none} #scrim{display:none} }
  .dwrap{padding:26px 26px calc(30px + env(safe-area-inset-bottom))}
  .dclose{background:none;border:none;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:0;display:flex;align-items:center;gap:6px}
  .dname{font-family:var(--serif);font-weight:600;font-size:26px;margin-top:14px;letter-spacing:-.2px}
  .drow{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line);cursor:pointer}
  .drow:first-child{border-top:none}
  .drow .dt{flex:1;font-size:16px;font-weight:500}
  .drow .dt small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:3px}
  .drow.sel{}
  .dcheck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
  .drow.sel .dcheck{background:var(--accent);border-color:var(--accent)}
  .dcard{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:18px 20px;margin-top:20px}
  .dstickybar{position:sticky;bottom:0;background:linear-gradient(to top,var(--paper) 70%,rgba(245,242,236,0));padding:14px 0 calc(10px + env(safe-area-inset-bottom));margin-top:20px}
  .learnmini{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .lmchip{background:#1d1d21;border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-size:13.5px;box-shadow:0 4px 12px rgba(20,32,30,.04)}
  .lmore{color:var(--muted);font-size:13px;align-self:center}
  /* student records */
  .nm .sub2{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .crumb{display:block;font-size:12.5px;color:var(--muted);margin-top:12px}
  .crumb a{color:var(--muted);cursor:pointer;text-decoration:none} .crumb a:hover{color:var(--ink)} .crumb b{color:var(--ink);font-weight:600}
  .menu{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:6px;margin-top:10px;box-shadow:0 8px 24px rgba(20,32,30,.1);max-width:280px}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:11px 12px;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;border-radius:8px}
  .menu button:hover{background:var(--tint)}
  .kvs{margin-top:8px}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
  .kv:first-child{border-top:none} .kv span{color:var(--muted)} .kv b{font-weight:600;text-align:right}
  .enrrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .enrrow:first-child{border-top:none} .enrrow b{font-weight:600;font-size:14.5px} .enrrow .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  .attrow{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);font-size:14px}
  .attrow:first-child{border-top:none} .attrow span{color:var(--muted)}
  .choice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:20px;margin-top:12px;cursor:pointer}
  .choice:hover{border-color:var(--accent-soft)}
  .choice b{font-weight:600;font-size:16px} .choice span{display:block;color:var(--muted);font-size:12.5px;margin-top:4px} .choice .chev{color:var(--faint,#B7B0A6);font-size:20px}
  .seg{display:flex;gap:6px;margin-top:10px;background:var(--tint);padding:4px;border-radius:12px}
  .segb{flex:1;border:none;background:none;padding:10px;border-radius:9px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .segb.on{background:#2b2b32;color:var(--ink);box-shadow:0 1px 3px rgba(20,32,30,.08)}
  #offbar{position:fixed;top:0;left:0;right:0;z-index:60;background:#25302E;color:#fff;text-align:center;font-size:12.5px;font-weight:500;padding:8px 12px;transform:translateY(-100%);transition:transform .25s}
  #offbar.on{transform:none}
  #installchip{position:fixed;left:50%;transform:translateX(-50%) translateY(160%);bottom:88px;z-index:55;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:12px 18px;font-family:inherit;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(20,32,30,.22);display:flex;align-items:center;gap:10px;transition:transform .3s;cursor:pointer}
  #installchip.on{transform:translateX(-50%)}
  #installchip .x{opacity:.6;font-weight:400}
  @media(min-width:900px){ #installchip{bottom:24px} }
  .attn{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--hair);cursor:pointer}
  .attn:first-of-type{border-top:none}
  .attn .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
  .attn .dot.amber{background:var(--amber)} .attn .dot.off{background:var(--muted)}
  .attn b{font-size:13.5px;font-weight:600} .attn span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .attn .go{margin-left:auto;color:var(--accent);font-weight:700}
  /* stage navigation */
  .stages{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
  .stg{border:1px solid var(--hair);background:var(--surface);border-radius:11px;padding:8px 11px;cursor:pointer;text-align:left;min-width:78px;font-family:inherit;color:var(--ink)}
  .stg.on{border-color:var(--accent);background:var(--tint)}
  .stg .n{font-family:var(--serif);font-weight:600;font-size:13px;color:var(--accent)}
  .stg .t{font-size:11px;color:var(--muted);display:block;margin-top:2px}
  .stg .ok{color:var(--accent);font-weight:700;font-size:11px}
  /* seminars — calm / premium */
  .scard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-top:14px;cursor:pointer;text-decoration:none;color:inherit;transition:border-color .15s}
  .scard:hover{border-color:var(--accent-soft)}
  .scard .row2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .scard h3{margin-bottom:3px;font-size:18px} .scard .c{color:var(--muted);font-size:13.5px}
  .scard .st{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
  .scard .foot{display:flex;gap:24px;margin-top:16px;color:var(--muted);font-size:13px}
  .scard .foot b{font-family:var(--serif);font-weight:600;color:var(--ink)}
  .tabs{display:flex;gap:2px;margin-top:22px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{background:none;border:none;padding:9px 14px;font-family:inherit;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-radius:10px;white-space:nowrap}
  .tabs button.on{color:var(--accent);background:var(--tint)}
  .cohchips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .cohchip{background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:8px 14px;font-family:inherit;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
  .cohchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .lrow{display:flex;gap:14px;align-items:center;padding:16px 2px;border-top:1px solid var(--line);cursor:pointer}
  .lrow:first-child{border-top:none} .lrow .nm{flex:1;min-width:0} .lrow .nm b{font-weight:600;font-size:15px} .lrow .nm span{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
  .lrow .chev{color:var(--hair);font-size:20px;font-weight:400}
  .st2{font-size:12.5px;font-weight:500;color:var(--muted)} .st2.teal{color:var(--accent)}
  .kv{display:flex;justify-content:space-between;padding:15px 2px;border-top:1px solid var(--line);font-size:14.5px}
  .kv:first-child{border-top:none} .kv span{color:var(--muted)} .kv b{font-weight:600}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumbs .t{width:74px}
  .thumbs .t img{width:74px;height:74px;object-fit:cover;border-radius:10px;background:#171717;display:block}
  .thumbs .t span{font-size:10px;color:var(--muted);display:block;margin-top:3px;text-align:center}
  .acc{border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden;background:var(--surface)}
  .acc .hd{display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer}
  .acc .hd .nm b{font-weight:600;font-size:14.5px} .acc .hd .nm span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .acc .bd{padding:0 18px 18px;display:none} .acc.open .bd{display:block}
  .badge2{font-size:11px;font-weight:600;border-radius:20px;padding:3px 10px;background:var(--tint);color:var(--accent)}
  .badge2.done{background:#12331f;color:#6fe0ab} .badge2.prog{background:#2a2016;color:var(--amber)}
  /* section card + stats */
  .panelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 20px}
  .bigstats{display:flex;gap:34px;flex-wrap:wrap;margin-top:18px}
  .bigstats .s b{font-family:var(--serif);font-weight:600;font-size:30px;display:block;line-height:1}

async function boot(){
  try{
    await ensureSession();
    const saved=JSON.parse(localStorage.getItem(LS)||"null");

      E=saved;
      if(saved.phone) await rebind(saved.phone);   /* ΠΕΡΙΜΕΝΕ το re-bind του anon uid πριν φορτώσουμε staff δεδομένα → όχι not_staff */

function eduToast(title){
  let t=document.getElementById('edutoast');
  if(!t){ t=document.createElement('div'); t.id='edutoast'; t.style.cssText='position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:400;background:var(--accent);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 10px 26px rgba(246,63,180,.4);opacity:0;transition:opacity .25s;cursor:pointer;max-width:90%;text-align:center'; document.body.appendChild(t); }
  t.textContent=title; t.style.opacity='1'; t.onclick=()=>{ t.style.opacity='0'; viewReviews(); };
  clearTimeout(eduToast._t); eduToast._t=setTimeout(()=>{ t.style.opacity='0'; }, 7000);
}
async function eduPulse(){
  if(document.hidden||!E) return;
  const prev=(E&&E._pend)||0;
  await refreshPending();
  const now=(E&&E._pend)||0;
  if(now>prev) eduToast('📥 Νέα εργασία για αξιολόγηση');
  if(CURNAV) setNav(CURNAV);
}
function startEduLive(){
  if(EDU_LIVE||!E) return;
  EDU_LIVE=setInterval(eduPulse, 25000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) eduPulse(); });
  window.addEventListener('focus',eduPulse);
  try{ sb.channel('edu-live').on('postgres_changes',{event:'*',schema:'public',table:'training_attempts'},()=>eduPulse()).subscribe(); }catch(e){}
}

async function doPhoneLogin(){
  const v=(document.getElementById('ph').value||'').trim();
  if(!v || v.replace(/\D/g,'').length<8){ login("Βάλε ένα σωστό τηλέφωνο."); return; }
  const b=document.getElementById('go'); b.disabled=true; b.textContent="…";
  try{
    await ensureSession();
    const {data,error}=await sb.rpc('educator_login_by_phone',{p_phone:v});
    if(error){ if(/not_found/i.test(error.message||'')){ login("Δεν βρήκαμε λογαριασμό educator με αυτό το τηλέφωνο."); return; } throw error; }
    if(!data||!data.length){ login("Δεν βρήκαμε λογαριασμό educator με αυτό το τηλέφωνο."); return; }
    const r=data[0]; E={educatorId:r.educator_id,name:r.educator_name,academyId:r.academy_id,academyName:r.academy_name,logo:r.academy_logo,accent:r.accent,phone:v};
    localStorage.setItem(LS,JSON.stringify(E));
    await loadOwner(); viewToday();
  }catch(e){ login("Πρόβλημα σύνδεσης, δοκίμασε ξανά."); }
}

/* ---------- DATA HELPERS ---------- */
async function loadCohorts(){
  const {data,error}=await sb.from('cohorts').select('id,name,start_date, courses(id,title,total_sessions)').eq('academy_id',E.academyId).order('start_date',{ascending:true});
  if(error) throw error;
  const out=[]; const today=todayAthens();
  for(const co of (data||[])){
    const total=co.courses?co.courses.total_sessions:0;
    const [{count:enrCount},{data:sdone},{data:snext}]=await Promise.all([
      sb.from('enrollments').select('id',{count:'exact',head:true}).eq('cohort_id',co.id).eq('status','active'),
      sb.from('sessions').select('sequence_number',{count:'exact'}).eq('cohort_id',co.id).lte('session_date',today).order('sequence_number',{ascending:false}).limit(1),
      sb.from('sessions').select('sequence_number,session_date,start_time,end_time,id').eq('cohort_id',co.id).gte('session_date',today).order('session_date',{ascending:true}).limit(1)
    ]);
    const done=(sdone&&sdone[0])?sdone[0].sequence_number:0;
    let status='active'; if(total&&done>=total) status='completed'; else if(done===0 && co.start_date && co.start_date>today) status='upcoming';
    out.push({id:co.id,name:co.name,course:co.courses?co.courses.title:'',courseId:co.courses?co.courses.id:null,total,done,students:enrCount||0,status,start:co.start_date});
  }
  CUR.cohorts=out; return out;
}
async function reviewList(){
  const {data,error}=await sb.from('training_attempts')
    .select('id,submitted_at,technique_id,work_type, techniques!training_attempts_technique_id_fkey(title,course_id), sessions(sequence_number,cohort_id, cohorts(name)), enrollments(students(name))')
    .eq('status','submitted').order('submitted_at',{ascending:true});
  if(error) throw error;
  return (data||[]).map(a=>({id:a.id,tech:a.techniques?a.techniques.title:'',courseId:a.techniques?a.techniques.course_id:null,techId:a.technique_id,
    homework:a.work_type==='homework',
    seq:a.sessions?a.sessions.sequence_number:'?',cohort:a.sessions&&a.sessions.cohorts?a.sessions.cohorts.name:'',
    name:a.enrollments&&a.enrollments.students?a.enrollments.students.name:'—',at:a.submitted_at}));
}
async function refreshPending(){ try{ const l=await reviewList(); E._pend=l.length; localStorage.setItem(LS,JSON.stringify(E)); return l; }catch(e){ return []; } }

/* ---------- TODAY ---------- */
async function viewToday(opts){
  setNav('today'); scroll.className='scroll'; scroll.innerHTML='<div class="spin"></div>';
  try{
    const cohorts=await loadCohorts();
    const today=todayAthens();
    // collect ALL cohorts with a session today → if 2+, show a switcher instead of one giant mixed list
    const todayList=[];
    for(const co of cohorts){
      const {data:ses}=await sb.from('sessions').select('id,sequence_number,start_time,end_time').eq('cohort_id',co.id).eq('session_date',today).order('start_time').limit(1);
      if(ses&&ses[0]) todayList.push({co, ses:ses[0]});
    }
    let chosen=null, todaySession=null;
    if(opts&&opts.cohortId){ const m=todayList.find(x=>x.co.id===opts.cohortId); if(m){ chosen=m.co; todaySession=m.ses; } else chosen=cohorts.find(c=>c.id===opts.cohortId)||null; }
    if(!chosen && todayList.length){ chosen=todayList[0].co; todaySession=todayList[0].ses; }
    if(!chosen) chosen=cohorts.find(c=>c.status==='active')||cohorts[0];
    CUR.cohort=chosen;
    await refreshPending(); setNav('today');
    if(!chosen){ scroll.innerHTML=`<div class="fade"><h1>Σήμερα</h1><p class="role">Δεν υπάρχουν σεμινάρια ακόμη.</p><button class="cta sm" style="margin-top:16px" onclick="wizard()">+ Νέο Σεμινάριο</button></div>`; return; }

    const {data:rows,error}=await sb.rpc('educator_today',{p_cohort:chosen.id}); if(error) throw error;
    const list=rows||[];
    let HW=[]; try{ const {data:hwo}=await sb.rpc('homework_overview',{p_cohort:chosen.id}); HW=hwo||[]; }catch(e){}
    const PRIO={submitted:0,in_progress:1,no_assignment:2,reviewed:3};
    let submittedCount=0;
    const present=[], absent=[];
    for(const st of list){
      if(st.state==='not_checked_in'){ absent.push(st); continue; }
      if(st.state==='submitted') submittedCount++;
      present.push(st);
    }
    present.sort((a,b)=>((PRIO[a.state]??9)-(PRIO[b.state]??9)) || (a.checked_in_at||'').localeCompare(b.checked_in_at||''));

    function presentRow(st){
      const plan=st.plan_count>1?` <span class="exc" style="background:var(--tint);color:var(--accent)">+${st.plan_count-1}</span>`:'';
      let techLine, rt, cls='';
      if(st.state==='no_assignment'){
        cls=' needsassign';
        techLine=`<span class="tech" style="color:var(--amber)">Χωρίς σημερινή ανάθεση</span><span class="sub">Παρούσα · ${timeOf(st.checked_in_at)}</span>`;
        rt=`<span class="pill wait assign" data-enr="${st.enrollment_id}" data-name="${esc(st.student_name)}">Ανάθεση →</span>`;
      } else if(st.state==='submitted'){
        techLine=`<span class="tech">${esc(st.current_technique)}</span><span class="sub">Παρούσα · ${timeOf(st.checked_in_at)}</span>`;
        rt=`<span class="prog">${st.stages_done}/${st.stages_total}<span class="d"> φωτο</span></span><span class="pill rev" data-att="${st.attempt_id}">Προς αξιολόγηση →</span>`;
      } else if(st.state==='in_progress'){
        techLine=`<span class="tech">${esc(st.current_technique)}</span><span class="sub">Παρούσα · ${timeOf(st.checked_in_at)}</span>`;
        rt=`<span class="prog">${st.stages_done}/${st.stages_total}<span class="d"> στάδια</span></span><span class="pill wait">Σε εξέλιξη</span>`;
      } else {
        techLine=`<span class="tech">${esc(st.current_technique)}</span><span class="sub">Ολοκληρώθηκε · ${num1(st.overall_score)}</span>`;
        rt=`<span class="pill rev assign" data-enr="${st.enrollment_id}" data-name="${esc(st.student_name)}">Επόμενο →</span>`;
      }
      return `<div class="srow${cls}" data-enr="${st.enrollment_id}"><div class="nmwrap" data-enr="${st.enrollment_id}" style="display:flex;align-items:center;gap:12px;flex:1;cursor:pointer"><div class="avatar">${initials(st.student_name)}</div>
        <div class="nm"><b>${esc(st.student_name)}${plan}</b>${techLine}</div></div>
        <div class="rt">${rt}</div></div>`;
    }
    const presentHtml=present.map(presentRow).join('');
    const absRow=st=>`<div class="absrow"><b>${esc(st.student_name)}</b><span>${esc(chosen.course||'')}</span></div>`;
    const absMoreN=3;
    const absentHtml = absent.length? `<div class="panel absentpanel">
        <p class="over">Δεν έχουν κάνει check-in ακόμη</p>
        <p class="role" style="margin-top:4px">${absent.length} ${absent.length===1?'μαθήτρια':'μαθήτριες'}</p>
        <div id="absList" style="margin-top:10px">${absent.slice(0,absMoreN).map(absRow).join('')}</div>
        ${absent.length>absMoreN?`<button class="link" id="absMore" style="margin-top:10px">Δες όλες (${absent.length}) →</button>`:''}
      </div>` : '';

    const sumParts=[]; const presentCount=present.length;
    if(presentCount>0) sumParts.push(`${presentCount} ${presentCount===1?'παρούσα':'παρούσες'}`);
    if(submittedCount>0) sumParts.push(`${submittedCount} προς αξιολόγηση`);
    const opSummary=sumParts.join(' · ');
    const dayLabel=new Date(today+'T00:00:00').toLocaleDateString('el-GR',{weekday:'long',day:'2-digit',month:'long'});
    const cohortChips = todayList.length>1
      ? `<div class="cohchips">${todayList.map(x=>`<button class="cohchip${x.co.id===chosen.id?' on':''}" data-coh="${x.co.id}">${esc(x.co.name||x.co.course||'Σεμινάριο')}${x.ses.start_time?' · '+String(x.ses.start_time).slice(0,5):''}</button>`).join('')}</div>`
      : '';
    const chosenName = todayList.length>1 ? `<p class="metaline" style="margin-top:2px">${esc(chosen.course||'')}${chosen.name?' · '+esc(chosen.name):''}</p>` : '';

    scroll.innerHTML=`<div class="fade maxwd">
      <h1 style="margin-top:2px">Σήμερα</h1>
      <p class="metaline" style="text-transform:capitalize">${esc(dayLabel)}</p>
      ${cohortChips}
      ${chosenName}
      ${opSummary?`<p class="role" style="margin-top:2px">${esc(opSummary)}</p>`:''}
      <div class="today2" style="margin-top:26px">
        <div>
          <p class="over">Παρούσες τώρα</p>
          <div style="margin-top:8px">${presentHtml||'<p class="role">Καμία μαθήτρια δεν έχει κάνει check-in ακόμη.</p>'}</div>
        </div>
        ${absentHtml?`<div class="attnwrap">${absentHtml}</div>`:''}
      </div>
      ${HW.length?`<div class="panel hwpanel" id="hwPanel" style="margin-top:22px;cursor:pointer">
        <div class="rowc"><p class="over">🏠 Εργασίες για το σπίτι</p><span class="chev">›</span></div>
        <p class="role" style="margin-top:4px">${HW.length} ανατέθηκαν · <b style="color:var(--amber)">${HW.filter(h=>h.status==='not_submitted'||h.status==='in_progress').length} δεν έχουν κάνει</b>${HW.filter(h=>h.status==='to_review').length?` · <b style="color:var(--accent)">${HW.filter(h=>h.status==='to_review').length} προς αξιολόγηση</b>`:''}</p>
      </div>`:''}
      </div>`;
    const byEnr={}; present.forEach(p=>byEnr[p.enrollment_id]=p);
    { const hp=document.getElementById('hwPanel'); if(hp) hp.onclick=()=>hwPopup(HW); }

function hwPopup(HW){
  HW=HW||[];
  const by=s=>HW.filter(r=>r.status===s);
  const rev=by('to_review'), prog=by('in_progress'), notsub=by('not_submitted'), comp=by('completed');

  const rowR=r=>`<div class="hwpr" data-att="${r.attempt_id}" style="cursor:pointer"><div class="l"><b>${esc(r.student_name)}</b><span class="sub">${esc(r.technique_name)} · ${r.submitted_at?('Υποβλήθηκε '+dshort(r.submitted_at)):'Υποβλήθηκε'}</span></div><span class="pill rev">Αξιολόγηση →</span></div>`;
  const rowP=r=>`<div class="hwrow2"><div class="l"><b>${esc(r.student_name)}</b><span class="sub">${esc(r.technique_name)} · ${r.progress_done||0}/${r.progress_total||0} φωτο</span></div></div>`;

  const grp=(t,a,f)=>a.length?`<p class="over" style="margin-top:18px">${t}</p><div style="margin-top:2px">${a.map(f).join('')}</div>`:'';
  let el=document.getElementById('confirmov'); if(el) el.remove();
  el=document.createElement('div'); el.id='confirmov';
  el.innerHTML=`<div class="cs-card" style="max-width:460px;text-align:left;max-height:82vh;overflow:auto">
    <div class="rowc" style="align-items:center"><h2 style="margin:0">🏠 Εργασίες για το σπίτι</h2><button class="xbtn" id="hw_x" aria-label="κλείσιμο">✕</button></div>
    <p class="role" style="margin-top:4px">${HW.length} ανατέθηκαν · ${notsub.length+prog.length} δεν έχουν κάνει</p>
    ${grp('Προς αξιολόγηση',rev,rowR)}
    ${grp('Σε εξέλιξη',prog,rowP)}
    ${grp('Δεν έχει υποβληθεί',notsub,rowN)}
    ${comp.length?`<details style="margin-top:18px"><summary style="cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase">Ολοκληρώθηκαν (${comp.length})</summary><div style="margin-top:2px">${comp.map(rowC).join('')}</div></details>`:''}
    ${!HW.length?'<p class="role" style="margin-top:14px">Καμία εργασία για το σπίτι ακόμη.</p>':''}
  </div>`;
  document.body.appendChild(el);
  el.onclick=(e)=>{ if(e.target===el) el.remove(); };
  document.getElementById('hw_x').onclick=()=>el.remove();
  el.querySelectorAll('.hwpr').forEach(r=>r.onclick=()=>{ el.remove(); openReview(r.dataset.att); });
}

/* ---------- ASSIGN TRAINING (curriculum picker) ---------- */
async function assignPicker(enrollmentId, name){
  setNav(false); scroll.className='scroll noNav'; scroll.innerHTML='<div class="spin"></div>';
  try{
    const [{data,error},{data:revs},{data:actData}]=await Promise.all([
      sb.rpc('curriculum_picker',{p_enrollment:enrollmentId}),
      sb.from('training_attempts').select('technique_id,overall_score,lesson_final_score,reviewed_at').eq('enrollment_id',enrollmentId).eq('status','reviewed').order('reviewed_at',{ascending:false}),
      sb.rpc('active_assignment',{p_enrollment:enrollmentId})
    ]);
    if(error) throw error;
    const items=data||[];
    // Lesson score = educator-set final if present, else latest reviewed overall (History keeps every attempt).
    const scoreMap={}; const finalMap={};
    (revs||[]).forEach(r=>{
      if(r.lesson_final_score!=null && finalMap[r.technique_id]==null) finalMap[r.technique_id]=r.lesson_final_score;
      if(scoreMap[r.technique_id]==null && r.overall_score!=null) scoreMap[r.technique_id]=r.overall_score;
    });
    Object.keys(finalMap).forEach(k=>{ scoreMap[k]=finalMap[k]; });
    // Strict split by status only (is_open is unreliable — true for completed items too).
    // Every item lands in exactly one bucket: completed | remaining(not_started) | in-progress(anything active).
    const completed = items.filter(i=>i.status==='completed');
    const remaining = items.filter(i=>i.status==='not_started');
    const pendingHw = items.filter(i=>i.status==='class_done_homework_pending');
    const inprog    = items.filter(i=>i.status==='in_progress');
    const first=((name||'').split(' ')[0])||'η μαθήτρια';
    // One active assignment at a time: label reflects whether one already exists.
    const active=(actData&&actData[0])||null;
    const actionLabel = active ? 'Αλλαγή' : 'Ανάθεση';

    const remRow=i=>`<div class="rowlink pickrow" data-tec="${i.technique_id}"><div><b style="font-weight:600">${esc(i.title)}</b><div style="color:var(--muted);font-size:12.5px;margin-top:2px">${i.topics_count} θέματα · ${i.stages_count} στάδια</div></div><span class="st2 teal">${actionLabel}</span></div>`;
    const inprogHtml = inprog.length ? `<p class="over" style="margin-top:22px">Σε εξέλιξη</p>
      <div style="margin-top:6px">${inprog.map(i=>`<div class="rowlink openrow" data-tec="${i.technique_id}" style="background:var(--tint);border-radius:14px;padding:14px 16px;border-top:none"><div><b style="font-weight:600;font-family:var(--serif);font-size:16px">${esc(i.title)}</b><div style="color:var(--muted);font-size:12px;margin-top:2px">Ανοιχτή εργασία</div></div><span class="st2 teal">Συνέχεια</span></div>`).join('')}</div>` : '';
    const remHtml = remaining.length
      ? `<div class="field" style="margin-top:8px"><input id="ap_search" placeholder="Αναζήτηση στην υπόλοιπη ύλη…" autocapitalize="none"/></div><div id="ap_all" style="margin-top:2px">${remaining.map(remRow).join('')}</div>`
      : `<p class="role" style="margin-top:8px;color:var(--accent)">✓ Η ${esc(first)} έχει ολοκληρώσει όλη την ύλη.</p>`;
    const compHtml = completed.length
      ? `<div class="rowlink" id="ap_completed" style="margin-top:14px"><div><b style="font-weight:600">Ολοκληρωμένα</b></div><div style="display:flex;align-items:center;gap:10px"><span style="color:var(--muted);font-size:12.5px">${completed.length} ${completed.length===1?'τεχνική':'τεχνικές'}</span><span class="chev">›</span></div></div>`
      : '';

    scroll.innerHTML=`<div class="fade maxw"><button class="back" id="ap_back">← Σήμερα</button>
      <p class="over">Επιλογή εκπαίδευσης</p>
      <h1 style="font-size:28px;margin-top:6px">${esc(name)}</h1>
      <p class="subtitle">Διάλεξε τι θα δουλέψει τώρα.</p>
      ${inprogHtml}
      ${pendingHw.length?`<p class="over" style="margin-top:22px">Εκκρεμεί εργασία για το σπίτι</p>
        <div style="margin-top:6px">${pendingHw.map(i=>`<div class="rowlink" style="cursor:default"><div><b style="font-weight:600">${esc(i.title)}</b><div style="color:var(--amber);font-size:12px;margin-top:2px">Η τάξη ολοκληρώθηκε · εκκρεμεί η εργασία για το σπίτι</div></div></div>`).join('')}</div>`:''}
      <p class="over" style="margin-top:24px">Υπόλοιπη ύλη</p>
      ${remHtml}
      ${compHtml}</div>`;
    document.getElementById('ap_back').onclick=()=>viewToday();
    function wirePick(){ scroll.querySelectorAll('.pickrow').forEach(el=>{ const it=items.find(x=>x.technique_id===el.dataset.tec); el.onclick=()=>applyAssignment(enrollmentId, el.dataset.tec, {title:it?it.title:'', name, after:viewToday, onBack:()=>assignPicker(enrollmentId,name)}); }); }
    scroll.querySelectorAll('.openrow').forEach(el=>el.onclick=()=>viewToday());
    const s=document.getElementById('ap_search');
    if(s){ const all=document.getElementById('ap_all'); s.oninput=e=>{const q=normtext(e.target.value); all.innerHTML=(remaining.filter(i=>normtext(i.title).includes(q)).map(remRow).join(''))||'<p class="role">Καμία τεχνική.</p>'; wirePick();}; }
    wirePick();
    const cb=document.getElementById('ap_completed'); if(cb) cb.onclick=()=>completedList(enrollmentId, name, completed, scoreMap);
  }catch(e){ showError("Δεν άνοιξε η επιλογή εκπαίδευσης.",e); }
}
function completedList(enrollmentId, name, completed, scoreMap){
  scroll.className='scroll noNav';
  const row=i=>{ const s=scoreMap[i.technique_id]; const low=(s!=null&&s<7);
    return `<div class="rowlink complrow" data-tec="${i.technique_id}" data-title="${esc(i.title)}"><div><b style="font-weight:600">${esc(i.title)}</b></div><div style="display:flex;align-items:center;gap:12px"><span class="score" style="font-size:17px;color:${low?'var(--amber)':'var(--ink)'}">${s!=null?num1(s):'—'}</span><span class="chev">›</span></div></div>`; };

// ONE active assignment at a time. Central gate for every assign/change/repeat path.
//  • no active            → assign directly
//  • active, not started  → confirm replace (Case A), then set
//  • active, started      → block (Case B) — never queue/overwrite
async function applyAssignment(enr, tec, opts){
  opts=opts||{};
  const after=opts.after||viewToday;
  let active=null;
  try{ const {data}=await sb.rpc('active_assignment',{p_enrollment:enr}); active=(data&&data[0])||null; }catch(e){}
  const doSet=async()=>{
    scroll.innerHTML='<div class="spin"></div>';
    try{ const {error}=await sb.rpc('set_active_assignment',{p_enrollment:enr, p_technique:tec}); if(error) throw error; after(); }
    catch(e){ const m=(e&&e.message)||'';
      if(/active_started/.test(m)){ blockActiveSheet((m.split('active_started:')[1]||'').trim()||(active&&active.title), opts.name, opts.onBack); }
      else showError("Δεν ανατέθηκε — δοκίμασε ξανά.", e); }
  };
  if(active && active.technique_id!==tec){
    const note = active.started
      ? `Η τρέχουσα εργασία “${active.title}” έχει ξεκινήσει — θα διατηρηθεί στο ιστορικό.`
      : `Η τρέχουσα εργασία “${active.title}” δεν έχει ξεκινήσει.`;
    confirmSheet({ title:'Αλλαγή μαθήματος;',
      body:`${note} Θέλεις να αλλάξεις σε “${opts.title||'νέα τεχνική'}”;`,
      ok:'Αλλαγή', okClass:'', onOk:()=>{ closeConfirm(); doSet(); } });
    return;
  }
  await doSet();
}
function blockActiveSheet(title, name, onBack){
  const first=((name||'').split(' ')[0])||'Η μαθήτρια';
  let el=document.getElementById('confirmov'); if(el) el.remove();
  el=document.createElement('div'); el.id='confirmov';
  el.innerHTML=`<div class="cs-card"><h2>Υπάρχει ήδη εργασία σε εξέλιξη</h2>
    <p class="cs-body">Η ${esc(first)} έχει ξεκινήσει: <b>${esc(title||'')}</b>. Ολοκλήρωσε ή κλείσε πρώτα την τρέχουσα εργασία πριν αναθέσεις άλλη τεχνική.</p>
    <button class="cs-ok" id="cs_ok">Πίσω στην εργασία</button></div>`;
  document.body.appendChild(el);
  el.onclick=(e)=>{ if(e.target===el) closeConfirm(); };
  document.getElementById('cs_ok').onclick=()=>{ closeConfirm(); if(onBack) onBack(); };
}

async function commitTraining(mode){

async function submitHomeworkReview(decision){
  const A=RV.att; const scored=A.stages.filter(s=>s.score!=null); const errBox=document.getElementById('rverr');
  if(scored.length<A.stages.length){ errBox.innerHTML='<div class="err">Βαθμολόγησε όλα τα στάδια πρώτα.</div>'; return; }
  if(decision==='homework_done' && A.finalScore==null){ errBox.innerHTML='<div class="err">Όρισε τον τελικό βαθμό μαθήματος.</div>'; return; }
  const btns=document.querySelectorAll('#hrep,#hdone'); btns.forEach(b=>b.disabled=true);
  try{
    const p_stages=A.stages.map(s=>({submission_id:s.submission_id,score:s.score,feedback:s.feedback||null}));
    const {error}=await sb.rpc('review_homework',{p_attempt:A.id,p_stages,p_overall_score:A.overall,p_overall_feedback:A.ofb||null,p_decision:decision,p_final_score:(decision==='homework_done'?A.finalScore:null),p_final_feedback:(decision==='homework_done'?(A.finalFb||null):null)});
    if(error) throw error;
    RV.list=RV.list.filter(a=>a.id!==A.id); E._pend=RV.list.length; localStorage.setItem(LS,JSON.stringify(E));
    if(RV.list.length){ openReview(RV.list[0].id); } else { viewReviews(); }
  }catch(e){ btns.forEach(b=>b.disabled=false); errBox.innerHTML='<div class="err">Δεν αποθηκεύτηκε — δοκίμασε ξανά.</div>'; console.error(e); try{ reportErr('review save: '+(e.message||e.details||e.code||'σφάλμα'), e&&(e.stack||JSON.stringify(e))); }catch(_){} }
}

const DOW=['Κυ','Δε','Τρ','Τε','Πε','Πα','Σα'];
const DOWfull=['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
function rhythmGen(start, days, total, st, en){
  const out=[]; let d=new Date(start+'T00:00:00'); let guard=0;
  while(out.length<total && guard<3660){ if(days.includes(d.getDay())) out.push({date:d.toISOString().slice(0,10),start:st,end:en}); d=new Date(d.getTime()+864e5); guard++; }
  return out;
}
function enableDrag(container, sel, onReorder){
  let from=null;
  container.querySelectorAll(sel).forEach((el,i)=>{
    el.setAttribute('draggable','true');
    el.addEventListener('dragstart',()=>{from=i;el.classList.add('drag');});
    el.addEventListener('dragend',()=>{el.classList.remove('drag');container.querySelectorAll(sel).forEach(x=>x.classList.remove('over'));});
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over');});
    el.addEventListener('dragleave',()=>el.classList.remove('over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');if(from!=null&&from!==i)onReorder(from,i);});
  });
}

      box.querySelectorAll('.ordb[data-down]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const i=+b.dataset.down; if(i>=T.length-1)return; const arr=T.slice(); [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; persistOrder(arr); });
      const list=document.getElementById('tlist');

    }
    else if(tab==='students'){

      const rows=mine.map(r=>`<div class="lrow" data-id="${r.student_id}" data-enr="${r.enrollment_id}" style="cursor:pointer"><div class="avatar">${initials(r.name)}</div>

        <span class="sub2">${r.completed||0}/${pad2(r.total_tech||0)} ολοκληρωμένα · ${r.attendance_days||0} παρουσίες</span></div>
        <span class="badge2 done">Ενεργή</span></div>`).join('');
      box.innerHTML=`<p class="subtitle">Οι μαθήτριες εγγράφονται από εσένα.</p>
        <div style="margin-top:8px">${rows||'<p class="role" style="margin-top:8px">Καμία μαθήτρια ακόμη.</p>'}</div>
        <button class="addbtn" id="addStu">+ Προσθήκη μαθήτριας</button>`;
      box.querySelectorAll('.lrow').forEach(el=>el.onclick=()=>studentProfile(el.dataset.id, el.dataset.enr, semctx));
      document.getElementById('addStu').onclick=()=>studentAdd({...ctx, back:()=>seminarDetail(id,'students')});
    }
    else if(tab==='homework'){
      const {data:hw,error:he}=await sb.rpc('homework_overview',{p_cohort:id});
      if(he){ box.innerHTML='<p class="role">Δεν φόρτωσαν οι εργασίες για το σπίτι.</p>'; }
      else {
        const list=hw||[]; const by=s=>list.filter(r=>r.status===s);
        const rev=by('to_review'), prog=by('in_progress'), notsub=by('not_submitted'), comp=by('completed');
        const dshort=d=>{ try{ return new Date(d).toLocaleDateString('el-GR',{day:'2-digit',month:'short'}); }catch(e){ return ''; } };
        const summary=`<div class="hwsum"><span><b>${list.length}</b> Ανατέθηκαν</span><span><b>${notsub.length}</b> Δεν ξεκίνησαν</span><span><b>${prog.length}</b> Σε εξέλιξη</span><span><b>${rev.length}</b> Προς αξιολόγηση</span><span><b>${comp.length}</b> Ολοκληρώθηκαν</span></div>`;
        const rowR=r=>`<div class="lrow hwr" data-att="${r.attempt_id}" style="cursor:pointer"><div class="avatar">${initials(r.student_name)}</div><div class="nm"><b>${esc(r.student_name)}</b><span>${esc(r.technique_name)} · Εργασία για το σπίτι · ${r.submitted_at?('Υποβλήθηκε '+dshort(r.submitted_at)):'Υποβλήθηκε'}</span></div><span class="st2 teal">Αξιολόγηση →</span></div>`;
        const rowP=r=>`<div class="lrow"><div class="avatar">${initials(r.student_name)}</div><div class="nm"><b>${esc(r.student_name)}</b><span>${esc(r.technique_name)} · ${r.progress_done||0}/${r.progress_total||0} φωτογραφίες</span></div></div>`;
        const rowN=r=>`<div class="lrow"><div class="avatar">${initials(r.student_name)}</div><div class="nm"><b>${esc(r.student_name)}</b><span>${esc(r.technique_name)} · Απαιτείται</span></div></div>`;
        const rowC=r=>`<div class="lrow"><div class="avatar">${initials(r.student_name)}</div><div class="nm"><b>${esc(r.student_name)}</b><span>${esc(r.technique_name)}${r.overall_score!=null?(' · '+num1(r.overall_score)+'/10'):''}</span></div></div>`;
        const grp=(title,arr,fn)=>arr.length?`<p class="over" style="margin-top:22px">${title}</p><div style="margin-top:6px">${arr.map(fn).join('')}</div>`:'';
        box.innerHTML=`${summary}
          ${grp('Προς αξιολόγηση',rev,rowR)}
          ${grp('Σε εξέλιξη',prog,rowP)}
          ${grp('Δεν έχει υποβληθεί',notsub,rowN)}
          ${comp.length?`<details class="hwdone" style="margin-top:22px"><summary>Ολοκληρώθηκαν (${comp.length})</summary><div style="margin-top:6px">${comp.map(rowC).join('')}</div></details>`:''}
          ${!list.length?'<p class="role" style="margin-top:18px">Καμία εργασία για το σπίτι σε αυτό το σεμινάριο ακόμη.</p>':''}`;
        box.querySelectorAll('.hwr').forEach(el=>el.onclick=()=>openReview(el.dataset.att));
      }
    }
    else if(tab==='schedule'){
      const {data:ses}=await sb.from('sessions').select('id,sequence_number,session_date,start_time,end_time').eq('cohort_id',id).order('sequence_number');
      const rhy=co.rhythm;
      const flexible = !(ses&&ses.length) && !(rhy&&rhy.days&&rhy.days.length);
      if(flexible){
        box.innerHTML=`<div class="panelcard" style="padding:20px"><p class="over">Ευέλικτο πρόγραμμα</p>
          <p class="subtitle" style="margin-top:8px">Αυτό το σεμινάριο δεν έχει σταθερές ώρες. Οι μέρες παρουσίας καταγράφονται αυτόματα από τα check-in των μαθητριών — δεν χρειάζεται να ορίσεις ωράριο.</p></div>
          <button class="link" id="addRhy" style="margin-top:16px">+ Πρόσθεσε σταθερό πρόγραμμα</button>`;
        document.getElementById('addRhy').onclick=()=>scheduleEditor(ctx);
        return;
      }
      const summary=rhy&&rhy.days&&rhy.days.length?`${rhy.days.map(d=>DOW[d]).join(' · ')} · ${rhy.start}–${rhy.end}`:'Προσαρμοσμένο πρόγραμμα';
      const isExc=(s)=>{ if(!rhy||!rhy.days) return false; const wd=new Date(s.session_date+'T00:00:00').getDay(); return !rhy.days.includes(wd)||hm(s.start_time)!==rhy.start||hm(s.end_time)!==rhy.end; };
      const rows=(ses||[]).map(s=>`<div class="rowlink" data-id="${s.id}"><div style="display:flex;gap:14px;align-items:center"><span class="num" style="color:var(--accent);font-family:var(--serif);font-weight:600">${pad2(s.sequence_number)}</span>
        <div><b style="font-weight:600">${new Date(s.session_date+'T00:00:00').toLocaleDateString('el-GR',{weekday:'short',day:'2-digit',month:'short'})}</b>${isExc(s)?'<span class="exc">εξαίρεση</span>':''}<div style="color:var(--muted);font-size:12.5px;margin-top:2px">${hm(s.start_time)}–${hm(s.end_time)}</div></div></div><span class="chev">›</span></div>`).join('');
      box.innerHTML=`<div class="panelcard" style="padding:18px 20px"><div class="rowc"><div><p class="over">Ρυθμός</p><p style="margin:6px 0 0;font-weight:600;font-size:14.5px">${summary}</p></div>
          <button class="link" id="editRhy">Επεξεργασία</button></div></div>
        <p class="over" style="margin-top:24px">Sessions</p>
        <div style="margin-top:6px">${rows||'<p class="role">Χωρίς πρόγραμμα.</p>'}</div>`;
      document.getElementById('editRhy').onclick=()=>scheduleEditor(ctx);
      box.querySelectorAll('.rowlink').forEach(el=>el.onclick=()=>sessionEdit({...ctx, sessionId:el.dataset.id}));
    }
    else if(tab==='settings'){
      box.innerHTML=`<div class="field"><label>Όνομα σεμιναρίου</label><input id="se_name" value="${esc(course.title||'')}"/></div>
        <div class="field"><label>Group / run</label><input id="se_group" value="${esc(co.name)}"/></div>
        <div class="field"><label>Ημ. έναρξης</label><input id="se_start" type="date" value="${co.start_date||''}"/></div>
        <div id="se_err"></div>
        <div class="hair" style="margin-top:30px"></div>
        <p class="over" style="margin-top:22px">Διαγραφή σεμιναρίου</p>
        <p class="subtitle" style="margin-top:6px">Διαγράφει οριστικά το σεμινάριο, τα sessions και τις εργασίες. <b style="color:var(--ink)">Οι μαθήτριες παραμένουν στη σχολή</b> και μπορείς να τις προσθέσεις σε άλλο σεμινάριο. Δεν αναιρείται.</p>
        <button class="link" id="se_del" style="color:var(--red);margin-top:10px">Διαγραφή σεμιναρίου</button>
        <div id="se_delbox"></div>
        <div class="stickybar"><button class="cta" id="se_save">Αποθήκευση</button></div>`;
      document.getElementById('se_save').onclick=async()=>{
        const b=document.getElementById('se_save'); b.disabled=true; b.textContent='Αποθήκευση…';
        try{
          await sb.from('courses').update({title:document.getElementById('se_name').value.trim()}).eq('id',co.course_id);
          await sb.from('cohorts').update({name:document.getElementById('se_group').value.trim(),start_date:document.getElementById('se_start').value||null}).eq('id',id);
          seminarDetail(id,'settings');
        }catch(e){ b.disabled=false; b.textContent='Αποθήκευση'; document.getElementById('se_err').innerHTML='<div class="err">Δεν αποθηκεύτηκε.</div>'; }
      };
      document.getElementById('se_del').onclick=()=>{
        document.getElementById('se_delbox').innerHTML=`<div class="confirmbox" style="margin-top:12px"><p>Σίγουρα; Θα διαγραφεί το «${esc(co.name)}» και οι εργασίες του. Οι μαθήτριες παραμένουν στη σχολή.</p>
          <div style="display:flex;gap:8px;margin-top:12px"><button class="cta ghost sm" id="se_cancel" style="flex:1">Άκυρο</button><button class="cta sm" id="se_confirm" style="flex:1;background:var(--red)">Ναι, διαγραφή</button></div></div>`;
        document.getElementById('se_cancel').onclick=()=>{ document.getElementById('se_delbox').innerHTML=''; };
        document.getElementById('se_confirm').onclick=async()=>{
          const c=document.getElementById('se_confirm'); c.disabled=true; c.textContent='Διαγραφή…';
          try{ const {error}=await sb.rpc('delete_cohort',{p_cohort:id}); if(error) throw error; viewSeminars(); }
          catch(e){ c.disabled=false; c.textContent='Ναι, διαγραφή'; document.getElementById('se_delbox').insertAdjacentHTML('beforeend','<div class="err">Δεν διαγράφηκε — δοκίμασε ξανά.</div>'); }
        };
      };
    }
  }catch(e){ showError("Δεν φόρτωσε το σεμινάριο.",e); }
}

/* ---------- TECHNIQUE EDITOR (dedicated screen) ---------- */
let TE=null;
async function techEditor(ctx){
  setNav(false); scroll.className='scroll noNav'; scroll.innerHTML='<div class="spin"></div>';
  try{
    if(ctx.techId){
      const {data:t}=await sb.from('techniques').select('id,title,topics,order_index,has_homework,homework_instructions').eq('id',ctx.techId).single();
      const [{data:steps},{data:mats}]=await Promise.all([
        sb.from('technique_steps').select('id,title,order_index,is_required,step_kind').eq('technique_id',ctx.techId).order('order_index'),
        sb.from('lesson_materials').select('id,name,image_path,product_url,sort_order').eq('technique_id',ctx.techId).eq('is_active',true).order('sort_order')
      ]);
      const all=(steps||[]);
      TE={ctx, id:t.id, order:t.order_index, name:t.title, topics:(t.topics||[]).slice(),
          stages:all.filter(s=>(s.step_kind||'class')==='class').map(s=>({id:s.id,title:s.title})),
          hwStages:all.filter(s=>s.step_kind==='homework').map(s=>({id:s.id,title:s.title})),
          materials:(mats||[]),
          hasHomework:!!t.has_homework, hwInstructions:t.homework_instructions||'', removed:[], removedHw:[]};
    } else {
      TE={ctx, id:null, order:null, name:'', topics:[], stages:[{id:null,title:'Προετοιμασία'},{id:null,title:'Τοποθέτηση υλικού'},{id:null,title:'Λιμάρισμα'},{id:null,title:'Τελικό Αποτέλεσμα'}], hwStages:[], materials:[], hasHomework:false, hwInstructions:'', removed:[], removedHw:[]};
    }
    renderTechEditor();
  }catch(e){ showError("Δεν άνοιξε η τεχνική.",e); }
}
function renderTechEditor(){
  const isNew=!TE.id;
  const editName = isNew || TE.editName;
  const nameBlock = editName
    ? `<div class="field" style="margin-top:12px"><input id="te_name" value="${esc(TE.name)}" placeholder="π.χ. Builder Gel"/></div>`
    : `<div class="tename">${esc(TE.name)||'—'}</div><button class="link" id="te_rename" style="margin-top:8px">Αλλαγή ονόματος</button>`;
  const topicHtml = TE.topics.map((tp,i)=>`<span class="tag">${esc(tp)}<button data-tp="${i}">✕</button></span>`).join('')
    + (TE.addingTopic?'':`<button class="tag add" id="te_addtopic_btn">+ Προσθήκη θέματος</button>`);
  const addTopicInput = TE.addingTopic
    ? `<div class="field" style="display:flex;gap:8px;margin-top:10px"><input id="te_newtopic" placeholder="Πρόσθεσε θέμα…"/><button class="cta ghost sm" id="te_addtopic" style="flex:none">Προσθήκη</button></div>` : '';
  scroll.innerHTML=`<div class="fade maxw">
    <div class="rowc"><button class="back" id="te_back" style="margin:0">← Τεχνικές</button>${isNew?'':`<button class="dotsbtn" id="te_menu">•••</button>`}</div>
    <p class="over" style="margin-top:16px">${isNew?'Νέα τεχνική':'Επεξεργασία'}</p>
    ${nameBlock}

    <p class="over" style="margin-top:30px">Θέματα</p>
    <div class="taglist" id="te_topics">${topicHtml}</div>
    ${addTopicInput}

    <p class="over" style="margin-top:32px">Φωτογραφίες εργασίας</p>
    <div id="te_stages" style="margin-top:8px">${TE.stages.map((s,i)=>`<div class="erow" data-i="${i}"><span class="grip">⠿</span><span class="num">${pad2(i+1)}</span><input class="g stgname" data-i="${i}" value="${esc(s.title)}" placeholder="Στάδιο" style="border:none;background:none;padding:8px 0;font-weight:600;font-size:15px"/><button class="del" data-del="${i}">✕</button></div>`).join('')}</div>
    <button class="addline" id="te_addstage">+ Προσθήκη σταδίου</button>

    <p class="over" style="margin-top:32px">Εργασία για το σπίτι</p>
    <label style="display:flex;align-items:center;gap:10px;margin-top:8px;cursor:pointer">
      <input type="checkbox" id="te_hw_on" ${TE.hasHomework?'checked':''} style="width:18px;height:18px"/>
      <span style="font-weight:600;font-size:14px">Έχει εργασία για το σπίτι</span>
    </label>
    ${TE.hasHomework?`
      <div class="field" style="margin-top:12px"><textarea id="te_hw_instr" placeholder="Οδηγίες, π.χ. «Κάνε ξανά σε 5 tips.»" style="width:100%;min-height:70px;border:1px solid var(--hair);border-radius:12px;padding:10px 13px;font:inherit;resize:vertical">${esc(TE.hwInstructions)}</textarea></div>
      <p class="over" style="margin-top:18px">Φωτογραφίες εργασίας για το σπίτι</p>
      <div id="te_hwstages" style="margin-top:8px">${TE.hwStages.map((s,i)=>`<div class="erow" data-i="${i}"><span class="grip">⠿</span><span class="num">${pad2(i+1)}</span><input class="g hwstgname" data-i="${i}" value="${esc(s.title)}" placeholder="Στάδιο" style="border:none;background:none;padding:8px 0;font-weight:600;font-size:15px"/><button class="del" data-hwdel="${i}">✕</button></div>`).join('')}</div>
      <button class="addline" id="te_hwaddstage">+ Προσθήκη σταδίου</button>
    `:''}

    <p class="over" style="margin-top:32px">Υλικά που χρησιμοποιούνται</p>
    ${isNew
      ? '<p class="role" style="margin-top:6px;color:var(--muted)">Αποθήκευσε πρώτα το μάθημα για να προσθέσεις υλικά.</p>'
      : '<div id="te_materials" style="margin-top:6px"></div><button class="addline" id="te_addmat">+ Προσθήκη υλικού</button>'}

    ${(TE.menuOpen&&!isNew)?`<div class="confirmbox" id="te_confirm"><p>Διαγραφή αυτής της τεχνικής;</p><div style="display:flex;gap:8px;margin-top:12px"><button class="cta ghost sm" id="te_cancel" style="flex:1">Άκυρο</button><button class="cta sm" id="te_del2" style="flex:1;background:var(--red)">Διαγραφή</button></div></div>`:''}
    <div id="te_err"></div>
    <div class="stickybar"><button class="cta" id="te_save">Αποθήκευση</button></div></div>`;

  document.getElementById('te_back').onclick=()=>TE.ctx.back();
  const nameEl=document.getElementById('te_name'); if(nameEl) nameEl.oninput=e=>TE.name=e.target.value;
  const renameEl=document.getElementById('te_rename'); if(renameEl) renameEl.onclick=()=>{TE.editName=true;renderTechEditor();document.getElementById('te_name').focus();};
  const menuEl=document.getElementById('te_menu'); if(menuEl) menuEl.onclick=()=>{TE.menuOpen=!TE.menuOpen;renderTechEditor();};
  const addBtn=document.getElementById('te_addtopic_btn'); if(addBtn) addBtn.onclick=()=>{TE.addingTopic=true;renderTechEditor();document.getElementById('te_newtopic').focus();};
  const addTopic=document.getElementById('te_addtopic'); if(addTopic) addTopic.onclick=()=>{const el=document.getElementById('te_newtopic');const v=el.value.trim();if(v){TE.topics.push(v);}TE.addingTopic=false;renderTechEditor();};
  const newTopic=document.getElementById('te_newtopic'); if(newTopic) newTopic.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.getElementById('te_addtopic').click();}});
  scroll.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{TE.topics.splice(+b.dataset.tp,1);renderTechEditor();});
  scroll.querySelectorAll('.stgname').forEach(inp=>inp.oninput=e=>TE.stages[+inp.dataset.i].title=e.target.value);
  scroll.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const i=+b.dataset.del;const s=TE.stages[i];if(s.id)TE.removed.push(s.id);TE.stages.splice(i,1);renderTechEditor();});
  document.getElementById('te_addstage').onclick=()=>{TE.stages.push({id:null,title:''});renderTechEditor();};
  enableDrag(document.getElementById('te_stages'),'.erow',(from,to)=>{const [m]=TE.stages.splice(from,1);TE.stages.splice(to,0,m);renderTechEditor();});
  const cancel=document.getElementById('te_cancel'); if(cancel) cancel.onclick=()=>{TE.menuOpen=false;renderTechEditor();};
  const del2=document.getElementById('te_del2'); if(del2) del2.onclick=deleteTechnique;
  const hwOn=document.getElementById('te_hw_on'); if(hwOn) hwOn.onchange=e=>{ TE.hasHomework=e.target.checked; if(TE.hasHomework&&!TE.hwStages.length){TE.hwStages=[{id:null,title:'Προετοιμασία'},{id:null,title:'Τοποθέτηση υλικού'},{id:null,title:'Λιμάρισμα'},{id:null,title:'Τελικό Αποτέλεσμα'}];} renderTechEditor(); };
  const hwInstr=document.getElementById('te_hw_instr'); if(hwInstr) hwInstr.oninput=e=>TE.hwInstructions=e.target.value;
  scroll.querySelectorAll('.hwstgname').forEach(inp=>inp.oninput=e=>TE.hwStages[+inp.dataset.i].title=e.target.value);
  scroll.querySelectorAll('[data-hwdel]').forEach(b=>b.onclick=()=>{const i=+b.dataset.hwdel;const s=TE.hwStages[i];if(s.id)TE.removedHw.push(s.id);TE.hwStages.splice(i,1);renderTechEditor();});
  const hwAdd=document.getElementById('te_hwaddstage'); if(hwAdd) hwAdd.onclick=()=>{TE.hwStages.push({id:null,title:''});renderTechEditor();};
  const hwStagesEl=document.getElementById('te_hwstages'); if(hwStagesEl) enableDrag(hwStagesEl,'.erow',(from,to)=>{const [m]=TE.hwStages.splice(from,1);TE.hwStages.splice(to,0,m);renderTechEditor();});
  document.getElementById('te_save').onclick=saveTechnique;
  if(!isNew){ renderMaterials(); const am=document.getElementById('te_addmat'); if(am) am.onclick=addMaterial; }
}
async function signedMat(p){ if(!p)return null; if(/^https?:\/\//.test(p))return p; try{const{data}=await sb.storage.from('materials').createSignedUrl(p,3600);return data&&data.signedUrl||null;}catch(e){return null;} }
function renderMaterials(){
  const box=document.getElementById('te_materials'); if(!box) return;
  const mats=TE.materials||[];
  box.innerHTML = mats.length ? mats.map(m=>`
    <div class="mated" data-id="${m.id}">
      <div class="mth" data-thumb="${m.id}">${m.image_path?'…':'📷'}</div>
      <div class="mfields">
        <input class="mname" data-id="${m.id}" value="${esc(m.name||'')}" placeholder="Όνομα υλικού (π.χ. Base Gel)"/>
        <input class="murl" data-id="${m.id}" value="${esc(m.product_url||'')}" placeholder="https://… (link προϊόντος)" inputmode="url"/>
      </div>
      <button class="mdel" data-del="${m.id}" aria-label="διαγραφή">✕</button>
    </div>`).join('') : '<p class="role" style="color:var(--muted)">Κανένα υλικό ακόμη.</p>';
  mats.forEach(async m=>{ if(!m.image_path)return; const u=await signedMat(m.image_path); const el=box.querySelector(`[data-thumb="${m.id}"]`); if(el){ if(u){ el.style.backgroundImage=`url(${u})`; el.textContent=''; } else el.textContent='📷'; } });
  box.querySelectorAll('.mname').forEach(inp=>inp.onchange=()=>updateMaterial(inp.dataset.id,{name:inp.value.trim()}));
  box.querySelectorAll('.murl').forEach(inp=>inp.onchange=()=>{ const v=inp.value.trim(); if(v && !/^https:\/\//i.test(v)){ inp.style.borderColor='var(--red)'; return; } inp.style.borderColor=''; updateMaterial(inp.dataset.id,{product_url:v||null}); });
  box.querySelectorAll('.mth[data-thumb]').forEach(el=>el.onclick=()=>pickMaterialImage(el.dataset.thumb));

async function addMaterial(){ if(!TE.id)return; const ord=(TE.materials||[]).length; const {data,error}=await sb.from('lesson_materials').insert({technique_id:TE.id,name:'',sort_order:ord}).select('id,name,image_path,product_url,sort_order').single(); if(!error&&data){ (TE.materials=TE.materials||[]).push(data); renderMaterials(); } }
async function updateMaterial(id,patch){ try{ await sb.from('lesson_materials').update(patch).eq('id',id); const m=(TE.materials||[]).find(x=>x.id===id); if(m)Object.assign(m,patch); }catch(e){} }
async function deleteMaterial(id){ try{ await sb.from('lesson_materials').delete().eq('id',id); TE.materials=(TE.materials||[]).filter(x=>x.id!==id); renderMaterials(); }catch(e){} }
function pickMaterialImage(id){ let inp=document.getElementById('te_matfile'); if(!inp){ inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.id='te_matfile'; inp.style.display='none'; document.body.appendChild(inp); } inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; inp.value=''; if(f) await uploadMaterialImage(id,f); }; inp.click(); }
async function uploadMaterialImage(id,file){
  const el=document.querySelector(`.mth[data-thumb="${id}"]`); if(el) el.textContent='…';
  try{
    const ext=((file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''))||'jpg';
    const uid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+''+Math.random().toString(16).slice(2));
    const path=`${E.academyId}/${TE.id}/${uid}.${ext}`;
    const {error}=await sb.storage.from('materials').upload(path,file,{contentType:file.type||'image/jpeg'}); if(error) throw error;
    await sb.from('lesson_materials').update({image_path:path}).eq('id',id);
    const m=(TE.materials||[]).find(x=>x.id===id); if(m)m.image_path=path;
    renderMaterials();
  }catch(e){ if(el) el.textContent='⚠'; }
}
async function saveTechnique(){
  const nameEl=document.getElementById('te_name'); TE.name=((nameEl?nameEl.value:TE.name)||'').trim();
  TE.stages=TE.stages.filter(s=>(s.title||'').trim()).map(s=>({...s,title:s.title.trim()}));
  TE.hwStages=(TE.hwStages||[]).filter(s=>(s.title||'').trim()).map(s=>({...s,title:s.title.trim()}));
  if(!TE.name){ document.getElementById('te_err').innerHTML='<div class="err">Βάλε όνομα τεχνικής.</div>'; return; }
  const b=document.getElementById('te_save'); b.disabled=true; b.textContent='Αποθήκευση…';
  try{
    let techId=TE.id;
    if(!techId){
      const {data:mx}=await sb.from('techniques').select('order_index').eq('course_id',TE.ctx.courseId).order('order_index',{ascending:false}).limit(1);
      const ord=(mx&&mx[0]?mx[0].order_index:0)+1;
      const {data:t,error}=await sb.from('techniques').insert({course_id:TE.ctx.courseId,title:TE.name,order_index:ord,topics:TE.topics,has_homework:!!TE.hasHomework,homework_instructions:(TE.hasHomework?TE.hwInstructions:null)}).select('id').single(); if(error) throw error;
      techId=t.id;
    } else {
      await sb.from('techniques').update({title:TE.name,topics:TE.topics,has_homework:!!TE.hasHomework,homework_instructions:(TE.hasHomework?TE.hwInstructions:null)}).eq('id',techId);
    }
    for(const rid of TE.removed){ try{ await sb.from('technique_steps').delete().eq('id',rid); }catch(e){} }
    for(let i=0;i<TE.stages.length;i++){ const s=TE.stages[i];
      if(s.id){ await sb.from('technique_steps').update({title:s.title,order_index:i+1,step_kind:'class'}).eq('id',s.id); }
      else { await sb.from('technique_steps').insert({technique_id:techId,title:s.title,order_index:i+1,is_required:true,step_kind:'class'}); }
    }
    for(const rid of (TE.removedHw||[])){ try{ await sb.from('technique_steps').delete().eq('id',rid); }catch(e){} }
    for(let i=0;i<TE.hwStages.length;i++){ const s=TE.hwStages[i];
      if(s.id){ await sb.from('technique_steps').update({title:s.title,order_index:i+1,step_kind:'homework'}).eq('id',s.id); }
      else { await sb.from('technique_steps').insert({technique_id:techId,title:s.title,order_index:i+1,is_required:true,step_kind:'homework'}); }
    }
    TE.ctx.back();
  }catch(e){ b.disabled=false; b.textContent='Αποθήκευση'; document.getElementById('te_err').innerHTML='<div class="err">Δεν αποθηκεύτηκε: '+esc(e.message||'σφάλμα')+'</div>'; }
}
async function deleteTechnique(){

  const b=document.getElementById('te_del2'); if(b) b.textContent='Διαγραφή…';
  try{ await sb.from('technique_steps').delete().eq('technique_id',TE.id); const {error}=await sb.from('techniques').delete().eq('id',TE.id); if(error) throw error; TE.ctx.back(); }

}

      <p class="over" style="margin-top:24px">Πρόγραμμα</p>
      <div class="seg" id="w_mode"><button class="segb ${W.mode==='flexible'?'on':''}" data-m="flexible">Ευέλικτο</button><button class="segb ${W.mode==='fixed'?'on':''}" data-m="fixed">Σταθερές ώρες</button></div>
      <p class="subtitle" style="margin-top:8px">${W.mode==='flexible'?'Χωρίς σταθερό ωράριο. Οι μέρες καταγράφονται από τα check-in — ιδανικό για ευέλικτη φοίτηση.':'Όρισε μέρες και ώρες· τα sessions δημιουργούνται αυτόματα.'}</p>`;
  } else {
    const preview=rhythmGen(W.start,W.days,W.total,W.st,W.en); const ok=W.days.length>0;
    body=`<h1 style="font-size:28px;margin-top:14px">Ρυθμός</h1>
      <p class="subtitle">Διάλεξε ημέρες και ώρες — όλα τα sessions δημιουργούνται αυτόματα. Εξαιρέσεις ρυθμίζεις αργότερα.</p>
      <p class="over" style="margin-top:24px">Ημέρες</p>
      <div class="days" id="w_days">${DOW.map((d,i)=>`<button class="day ${W.days.includes(i)?'on':''}" data-d="${i}">${d}</button>`).join('')}</div>
      <div class="two" style="margin-top:20px">
        <div class="field" style="margin-top:0"><label>Έναρξη</label><input id="w_st" type="time" value="${W.st}"/></div>
        <div class="field" style="margin-top:0"><label>Λήξη</label><input id="w_en" type="time" value="${W.en}"/></div></div>
      <div class="field"><label>Σύνολο sessions</label><input id="w_total" type="number" min="1" value="${W.total}"/></div>
      <div class="panelcard" style="margin-top:20px;padding:16px 20px"><p style="margin:0;font-weight:600">${ok?`Θα δημιουργηθούν ${preview.length} sessions`:'Διάλεξε τουλάχιστον μία ημέρα'}</p>
        ${ok&&preview.length?`<p style="margin:6px 0 0;color:var(--muted);font-size:13px">${new Date(preview[0].date+'T00:00:00').toLocaleDateString('el-GR',{day:'2-digit',month:'short'})} → ${new Date(preview[preview.length-1].date+'T00:00:00').toLocaleDateString('el-GR',{day:'2-digit',month:'short'})}</p>`:''}</div>`;
  }
  const cta=`<div class="stickybar">${s>1?'<button class="cta ghost" id="w_back" style="flex:none;padding-left:20px;padding-right:20px">←</button>':''}<button class="cta" id="w_next">${(s===1&&W.mode==='fixed')?'Συνέχεια':'Δημιουργία σεμιναρίου'}</button></div><div id="w_err"></div>`;
  scroll.innerHTML=`<div class="fade maxw"><button class="back" onclick="viewSeminars()">← Άκυρο</button>${bar}${body}${cta}</div>`;
  document.getElementById('w_next').onclick=wizardNext;
  const bk=document.getElementById('w_back'); if(bk)bk.onclick=()=>{W.step--;renderWizard();};
  if(s===1){
    document.getElementById('w_name').oninput=e=>W.name=e.target.value;
    document.getElementById('w_group').oninput=e=>W.group=e.target.value;
    document.getElementById('w_start').oninput=e=>W.start=e.target.value;
    scroll.querySelectorAll('#w_mode .segb').forEach(b=>b.onclick=()=>{ W.name=document.getElementById('w_name').value; W.group=document.getElementById('w_group').value; W.start=document.getElementById('w_start').value; W.mode=b.dataset.m; renderWizard(); });
  } else {
    scroll.querySelectorAll('#w_days .day').forEach(b=>b.onclick=()=>{const d=+b.dataset.d;const i=W.days.indexOf(d);if(i>=0)W.days.splice(i,1);else W.days.push(d);W.days.sort();renderWizard();});
    document.getElementById('w_st').oninput=e=>W.st=e.target.value;
    document.getElementById('w_en').oninput=e=>W.en=e.target.value;
    document.getElementById('w_total').oninput=e=>{W.total=Math.max(1,+e.target.value||1);renderWizard();};
  }
}
function wizardNext(){
  if(W.step===1){ W.name=document.getElementById('w_name').value.trim(); W.group=document.getElementById('w_group').value.trim(); W.start=document.getElementById('w_start').value;
    if(!W.name||!W.group){ document.getElementById('w_err').innerHTML='<div class="err">Συμπλήρωσε όνομα και group.</div>'; return; }
    if(W.mode==='fixed'){ W.step=2; renderWizard(); return; }
    createSeminar(); return; }
  if(!W.days.length){ document.getElementById('w_err').innerHTML='<div class="err">Διάλεξε τουλάχιστον μία ημέρα.</div>'; return; }
  createSeminar();
}
async function createSeminar(){
  const btn=document.getElementById('w_next'); btn.disabled=true; btn.textContent='Δημιουργία…';
  try{
    const flexible = W.mode!=='fixed';
    const {data:course,error:ce}=await sb.from('courses').insert({academy_id:E.academyId,title:W.name,total_sessions:flexible?0:W.total}).select('id').single(); if(ce) throw ce;
    const cohortData={academy_id:E.academyId,course_id:course.id,name:W.group,start_date:W.start,rhythm:flexible?{days:[]}:{days:W.days,start:W.st,end:W.en}};
    const {data:cohort,error:coe}=await sb.from('cohorts').insert(cohortData).select('id').single(); if(coe) throw coe;
    if(!flexible){
      const rows=rhythmGen(W.start,W.days,W.total,W.st,W.en).map((s,i)=>({cohort_id:cohort.id,sequence_number:i+1,session_date:s.date,start_time:s.start,end_time:s.end}));
      if(rows.length){ const {error:sse}=await sb.from('sessions').insert(rows); if(sse) throw sse; }
    }
    W=null; seminarDetail(cohort.id,'techniques');
  }catch(e){ btn.disabled=false; btn.textContent='Δημιουργία σεμιναρίου'; document.getElementById('w_err').innerHTML='<div class="err">Δεν δημιουργήθηκε: '+esc(e.message||'σφάλμα')+'</div>'; console.error(e); try{ reportErr('createSeminar: '+(e.message||e.details||e.code||'σφάλμα'), e&&(e.stack||JSON.stringify(e))); }catch(_){} }
}

/* live refresh — new submissions / reviews appear without exit-reenter */
let ELIVE_T=null, ELIVE_D=null;
function eLive(fromFocus){
  if(document.hidden||!E) return;
  if(drawer.classList.contains('on')) return;   // don't disrupt quick-profile
  if(RV.att) return;                             // don't disrupt an open review
  const t=nav.querySelector('.tab.on'); const route=t?t.dataset.t:null;
  refreshPending().then(()=>{ if(route)setNav(route); });   // keep the Αξιολογήσεις badge live
  if(fromFocus){ if(route==='today') viewToday(); else if(route==='reviews') viewReviews(); }
}
function eLiveSoon(){ clearTimeout(ELIVE_D); ELIVE_D=setTimeout(()=>eLive(true), 600); }
function eStartLive(){
  if(ELIVE_T) return;
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) eLive(true); });
  window.addEventListener('focus',()=>eLive(true));
  ELIVE_T=setInterval(()=>eLive(false), 25000);
  try{ sb.channel('edu-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'training_attempts'},eLiveSoon)
    .on('postgres_changes',{event:'*',schema:'public',table:'submissions'},eLiveSoon)
    .subscribe(); }catch(e){}
}
function setupPWAChrome(){
  const off=document.getElementById('offbar'); if(off){ const upd=()=>off.classList.toggle('on',!navigator.onLine); window.addEventListener('online',upd); window.addEventListener('offline',upd); upd(); }
  const chip=document.getElementById('installchip'); let deferred=null;
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const hide=()=>{ if(chip) chip.classList.remove('on'); };
  if(chip){
    chip.onclick=async(ev)=>{
      const dismiss = ev.target.classList.contains('x');
      hide();
      if(dismiss){ localStorage.setItem('asna_edu_install_dismiss','1'); return; }
      if(deferred){ try{ deferred.prompt(); await deferred.userChoice; }catch(e){} deferred=null; }
    };
  }
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e;
    if(chip && !standalone && !localStorage.getItem('asna_edu_install_dismiss')) chip.classList.add('on'); });
  window.addEventListener('appinstalled',()=>{ hide(); localStorage.setItem('asna_edu_install_dismiss','1'); });
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{ try{reg.update();}catch(e){} }).catch(()=>{}));
  let _reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(_reloaded) return; _reloaded=true; location.reload(); });
}
setupPWAChrome(); eStartLive();
boot();
setTimeout(()=>{ const s=document.getElementById('splash'); if(s){ s.classList.add('hide'); setTimeout(()=>s.remove(),600); } }, 2250);
</script>
